# pytorch_lightning==2.0.0
seed_everything: null
trainer:
  logger:
    class_path: pytorch_lightning.loggers.WandbLogger
    init_args:
      project: Rotation_project
      entity: hairuow-carnegie-mellon-university
      name: FOXA1_ConvTowerDomain_v6
      save_dir: .
      log_model: true
  accelerator: gpu
  strategy: ddp_find_unused_parameters_true
  devices: 1
  num_nodes: 1
  precision: bf16-mixed
  callbacks:
  - class_path: pytorch_lightning.callbacks.EarlyStopping
    init_args:
      monitor: val_loss
      min_delta: 0.001
      patience: 20
      mode: min
  fast_dev_run: false
  max_epochs: 50
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: null
  log_every_n_steps: 50
  enable_checkpointing: true
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: null
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: checkpoints
ckpt_path: null
model:
  class_path: ConvTowerDomain_v6
  init_args:
    classification: True
    chroms_channel: 1
    input_len: 240 
    conv1d_filter: 128
    conv_tower_depth: 4
    conv_tower_kernel: 5
    conv_tower_dilation: 1
    attn_num_layers: 1
    attn_num_heads: 8
    attn_dim_feedforward: 1024
    dropout: 0.5
    gamma: 0.999999
    lr: 1e-5
    weight_decay: 1e-4
    seqonly: True
data:
  class_path: datamodule.SingleDataModuleWds
  init_args:
    config_file: null
    num_workers: 4
    batch_size: 128
    parent_dir: ./

